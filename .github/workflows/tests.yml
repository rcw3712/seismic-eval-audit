name: Seismic audit tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python verify_package.py
      - name: Install unchanged wheel into isolated directory
        run: python -m pip install --no-deps --no-index --target "${{ runner.temp }}/audit-wheel" dist/seismic_eval_audit-0.1.3-py3-none-any.whl
      - name: Exercise offline user workflow from installed wheel
        run: python docs/verify_walkthrough.py --installed "${{ runner.temp }}/audit-wheel" --output "${{ runner.temp }}/audit-usage"
